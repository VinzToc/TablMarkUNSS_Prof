<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TablMarkUNSS Prof</title>
<meta name="theme-color" content="#0a1428">
<meta name="description" content="Centralisation, validation et classements des feuilles de match UNSS.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TablMark Prof">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
/*
VOICE: outil de table de marque, direct et lisible au gymnase, dans la famille des applis du portail Mes Apps EPS.
IDEA: le tableau d'affichage lumineux du gymnase + la feuille de match officielle.
PICTURE: le tableau de score (équipes, chrono, score géant) est l'image principale.
COLOUR and TYPE: nuit bleue du portail, orange et bleu du logo TablMarkUNSS (équipe A orange, équipe B bleue) ; titre italique 900 en deux couleurs, chiffres en Barlow Condensed.
LAYOUT: en-tête du portail (logo, titre bicolore, pastille), cartes vitrées, actions par équipe côte à côte ; tout s'empile sous 600px.
*/
:root{color-scheme:dark;--bg:#0a1428;--panel:rgba(255,255,255,.07);--panel2:rgba(255,255,255,.11);--ink:#eef3ff;--mute:rgba(238,243,255,.62);--line:rgba(255,255,255,.15);
--c1:#ff8a1f;--c2:#2f9bff;--c3:#ffd27a;--A:#ff7a00;--B:#2f9bff;--Ad:rgba(255,122,0,.18);--Bd:rgba(47,155,255,.2);--board:rgba(4,10,24,.72);
--y:#ffd21f;--o:#ff8a1f;--r:#ff4d5e;--ok:#3ddc84;--gA:linear-gradient(135deg,#ffa21f,#ff5e00);--gB:linear-gradient(135deg,#2f9bff,#0a4fd0);
--cond:'Barlow Condensed','Arial Narrow',Arial,sans-serif;--sys:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sys);overflow-x:clip;-webkit-tap-highlight-color:transparent;min-height:100vh}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 8% 4%,rgba(255,138,31,.20),transparent 55%),radial-gradient(ellipse at 94% 96%,rgba(47,155,255,.22),transparent 55%)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border-radius:13px;min-height:44px;padding:0 16px;background:var(--panel);border:1.5px solid var(--line);font-weight:700;letter-spacing:.01em;transition:transform .12s,filter .15s,background .15s}
button:hover{filter:brightness(1.14)}button:active{transform:scale(.97)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--c1);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-p{background:var(--gA);border:0;color:#fff;box-shadow:0 6px 18px rgba(255,94,0,.32),inset 0 1px 0 rgba(255,255,255,.33);text-shadow:0 1px 2px rgba(0,0,0,.2)}

.btn-b{background:var(--gB);border:0;color:#fff;box-shadow:0 6px 18px rgba(10,79,208,.33),inset 0 1px 0 rgba(255,255,255,.33)}
.btn-d{color:#ff8f8f;border-color:rgba(255,143,143,.45)}
input,select,textarea{width:100%;min-height:44px;font-size:16px;border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;background:rgba(0,0,0,.32)}
select option{background:#0f1d38;color:var(--ink)}
input::placeholder,textarea::placeholder{color:rgba(238,243,255,.38)}
input[type=checkbox]{accent-color:var(--c1)}
textarea{min-height:90px;resize:vertical}
/* En-tête façon portail */
.top{position:sticky;top:0;z-index:20;background:rgba(10,20,40,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;align-items:center;gap:10px 14px;padding:10px max(3vw,12px) 12px;flex-wrap:wrap}
.top::after{content:'';position:absolute;left:12px;right:12px;bottom:0;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,var(--c1) 18%,var(--c3) 55%,var(--c2) 85%,transparent)}
.brand{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;color:inherit;text-align:left;min-height:0}

.brand img{width:46px;height:46px;border-radius:22%;display:block;box-shadow:0 0 0 2px rgba(255,255,255,.3),0 0 22px rgba(255,138,31,.45),0 6px 16px rgba(0,0,0,.4);transition:transform .3s}
.brand:hover img{transform:rotate(-5deg) scale(1.05)}
.brand h1{margin:0;font:italic 900 1.45rem/1.08 var(--sys);letter-spacing:.005em;color:#fff;text-shadow:0 2px 0 #06122e,0 4px 12px rgba(0,0,0,.45);white-space:nowrap}
.brand h1 .t2{background:linear-gradient(180deg,var(--c3),var(--c1) 70%);-webkit-background-clip:text;background-clip:text;color:var(--c1);-webkit-text-fill-color:transparent;text-shadow:none;filter:drop-shadow(0 2px 0 #06122e)}
.brand h1 .pill{font:normal 800 .55em var(--sys);vertical-align:middle;background:var(--gB);color:#fff;padding:2px 9px;border-radius:999px;border:1.5px solid #8ec9ff;margin-left:4px;text-shadow:none}
.brand p{margin:1px 0 0;font-size:.7rem;font-weight:600;color:var(--mute);letter-spacing:.1em;text-transform:uppercase}
.back{color:var(--ink);text-decoration:none;font-weight:700;font-size:14px;border:1.5px solid var(--line);border-radius:13px;padding:9px 14px;background:var(--panel);white-space:nowrap}
.back:hover{filter:brightness(1.2)}
.nav{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.nav button{flex:none;background:transparent;border:0;color:var(--mute);white-space:nowrap;padding:0 12px;border-radius:999px}
.nav button:hover{color:var(--ink);background:var(--panel)}
.nav button.on{color:#fff;background:var(--gB);box-shadow:0 4px 14px rgba(10,79,208,.4)}
main{max-width:1240px;margin:auto;padding:18px max(3vw,12px) 96px}
h1{font:italic 900 clamp(30px,4.6vw,44px)/1.06 var(--sys);margin:8px 0 6px;text-wrap:balance;letter-spacing:-.005em}
h2{margin:22px 0 10px;font:800 .85rem var(--sys);letter-spacing:.12em;text-transform:uppercase;color:var(--c1)}
h3{font:800 1.05rem/1.2 var(--sys);margin:0 0 10px}
.lead{color:var(--mute);max-width:65ch;margin:0 0 16px}
.card{position:relative;background:var(--panel);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:16px;box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.09)}
.card>h3:first-child{font-size:.82rem;letter-spacing:.12em;text-transform:uppercase;color:var(--c1)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.f{display:grid;gap:5px}.f span{font-size:.8rem;color:var(--mute);font-weight:700;letter-spacing:.03em}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--mute)}.small{font-size:13px}
.tag{display:inline-block;font-size:12px;font-weight:800;padding:2px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.tag.live{background:var(--gA);border-color:transparent;color:#fff}.tag.clos{background:var(--gB);border-color:transparent;color:#fff}.tag.valide{background:linear-gradient(135deg,#3ddc84,#16a05a);border-color:transparent;color:#05220f}
.dotA,.dotB{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--A);margin-right:6px;box-shadow:0 0 8px var(--A)}.dotB{background:var(--B);box-shadow:0 0 8px var(--B)}
.ov{position:fixed;inset:0;background:rgba(2,6,16,.7);backdrop-filter:blur(4px);z-index:50;display:grid;place-items:center;padding:14px}
.dlg{background:#13203d;border:1px solid var(--line);border-radius:20px;padding:20px;width:min(560px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);z-index:60;background:#13203d;border:1px solid var(--line);color:var(--ink);padding:12px 18px;border-radius:14px;font-weight:700;max-width:min(92vw,560px);box-shadow:0 10px 30px rgba(0,0,0,.5);display:none}
#toast.warn{background:var(--gA);border:0;color:#fff}
.scroll{overflow-x:auto}
table.list{width:100%;border-collapse:collapse;font-size:15px}
table.list th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);padding:8px;border-bottom:2px solid var(--line);white-space:nowrap}
table.list td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.list td.num{text-align:right;font:700 18px var(--cond);white-space:nowrap}
table.list tr.click{cursor:pointer}table.list tr.click:hover td{background:rgba(255,255,255,.05)}
.empty{padding:28px;text-align:center;color:var(--mute);border:2px dashed var(--line);border-radius:20px;background:rgba(255,255,255,.03)}
.storage{background:var(--gA);color:#fff;padding:9px 14px;border-radius:13px;font-weight:700;margin-bottom:12px}
#print{display:none}
@media print{#print{display:block}.top,main,#ov,#toast{display:none!important}body{background:#fff}body::before{display:none}}
@media(max-width:700px){.nav{order:3;width:100%;margin-left:0}.back{margin-left:auto;padding:7px 10px;font-size:13px}.brand p{display:none}.brand h1{font-size:1.2rem}.brand img{width:40px;height:40px}}
@media(max-width:600px){.grid2{grid-template-columns:1fr}table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--mute);font-size:12px}.stack td:empty{display:none}table.list.stack td{border:0}table.list.stack tr{border-bottom:1px solid var(--line)}}
@media(prefers-reduced-motion:no-preference){.flash{animation:fl .5s}@keyframes fl{from{transform:scale(1.18)}to{transform:none}}}

.sheet{background:#fff;color:#111;font:13px/1.4 Barlow,Arial,sans-serif;padding:18px;max-width:900px;margin:auto;border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.sh-h{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #111;padding-bottom:8px;margin-bottom:10px}
.sh-brand{font:700 13px 'Barlow Condensed',Arial;letter-spacing:.02em;color:#e05a00}.sheet h2{margin:0;font:700 24px/1.1 'Barlow Condensed',Arial}
.sheet h3{font:700 16px 'Barlow Condensed',Arial;margin:16px 0 6px;border-bottom:1px solid #999}
.sh-st{border:1.5px solid #111;padding:2px 8px;font-weight:700;font-size:12px}
.sh-t,.sh-meta{width:100%;border-collapse:collapse;margin:6px 0}.sh-t th,.sh-t td,.sh-meta th,.sh-meta td{border:1px solid #888;padding:3px 6px;text-align:center}
.sh-meta th{background:#eee;text-align:left;width:16%}.sh-meta td{text-align:left}.sh-t th{background:#eee}.sh-t td.l{text-align:left}
.sh-score{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:10px 0;border:2px solid #111;padding:8px}
.sh-score small{display:block;color:#555}.sh-score>div:last-child{text-align:right}.sh-big{font:700 40px 'Barlow Condensed',Arial}
.sh-win{margin:4px 0}.sh-small{margin:4px 0;font-size:12px;color:#333}.sh-obs{border:1px solid #888;padding:6px;min-height:36px}
.sh-sig{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.sh-sig div{border:1px solid #888;padding:4px;min-height:80px}
.sh-sig span{font-size:11px;display:block}.sh-sig img{width:100%;height:56px;object-fit:contain}.sh-f{margin-top:14px;font-size:11px;color:#555}
@media(max-width:600px){.sh-sig{grid-template-columns:1fr 1fr}.sh-big{font-size:30px}.sh-t{font-size:12px}}
@media print{body *{visibility:hidden}#print,#print *{visibility:visible}#print{position:absolute;inset:0}.sheet{padding:0;box-shadow:none;border-radius:0}}
/* --- Prof --- */
.drop{border:2px dashed var(--c2);border-radius:20px;padding:18px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;background:var(--panel)}
.drop.over{border-color:var(--B);background:var(--Bd)}
.drop label.file{display:grid;place-items:center;min-height:120px;border-radius:16px;background:var(--gA);color:#fff;box-shadow:0 8px 24px rgba(255,94,0,.3);font:italic 900 22px var(--sys);cursor:pointer;text-align:center;padding:10px}
.drop label.file input{display:none}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}
.kpi{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--c1);border-radius:18px;padding:14px}.kpi:nth-child(even){border-top-color:var(--c2)}.kpi b{display:block;font:700 44px/1 var(--cond)}.kpi span{font-size:13px;color:var(--mute)}
.filters{display:grid;grid-template-columns:2fr repeat(3,minmax(0,1fr));gap:8px;margin-bottom:10px}
.sc{font:700 20px var(--cond);white-space:nowrap}
.std th:nth-child(n+2),.std td:nth-child(n+2){text-align:right}
.std td.pts{font:700 20px var(--cond)}
.ins{list-style:none;margin:0;padding:0;max-height:220px;overflow:auto;display:grid;gap:4px}.ins li{padding:6px 10px;border-radius:10px;background:rgba(0,0,0,.2)}
.qrbox{background:#fff;border-radius:16px;padding:10px;width:min(380px,100%);margin:0 auto 10px}.qrbox svg{display:block;width:100%;height:auto}.qrnav{display:flex;gap:8px;align-items:center;justify-content:center;margin-bottom:10px}.qrnav b{min-width:64px;text-align:center;font:700 20px var(--cond)}
.plx{display:grid;gap:6px;margin:6px 0 4px}.px{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr) 44px 44px;gap:6px;align-items:center}.px input{min-height:40px;padding:6px 10px}.px button{padding:0;min-height:40px}.pobs{grid-column:1/-1;margin:-3px 0 2px 4px;font-size:12px;color:var(--c3)}
.prole{border:0;padding:0;margin:12px 0 0;display:flex;gap:16px;flex-wrap:wrap;align-items:center}.prole label{display:flex;gap:6px;align-items:center;font-weight:600}.prole input{width:20px;min-height:20px;accent-color:var(--c1)}
.coachf{margin-top:8px;display:none}.dlg:has(input[value=coach]:checked) .coachf{display:grid}
.cands{display:flex;flex-wrap:wrap;gap:6px}.cands button{min-height:40px;font-weight:600}.cands small{color:var(--mute);margin-left:6px;font-weight:400}
@media(max-width:600px){.px{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 44px 44px}.px>:nth-child(1){grid-area:1/1}.px>:nth-child(2){grid-area:1/2}.px>:nth-child(3){grid-area:2/1/3/3}.px>:nth-child(4){grid-area:1/3}.px>:nth-child(5){grid-area:1/4}.px>.pobs{grid-area:3/1/4/-1}}
.plist{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 12px}.plist span{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px}.plist i{font-style:normal;color:var(--mute);margin-left:6px;font-size:11px}
#dropx.over{border-color:var(--c1)}
.pts-cfg{display:grid;grid-template-columns:repeat(4,minmax(0,110px));gap:8px}
@media(max-width:700px){.drop{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}}
</style>
</head>

  const mk = (sport, A, B, ev, extra = {}) => ({ id: 'demo-' + sport + '-' + (A + B).replace(/\W/g, '').slice(-14), v: 1, sport, status: 'clos', created: Date.now(), updated: 1, closedAt: Date.now(),
    meta: { comp: 'Championnat district', niveau: 'District', date: '2026-11-25', heure: '14:00', lieu: 'Gymnase Jean-Moulin', cat: 'Minimes', sexe: 'Mixte', num: '', poule: 'Poule A' },

    officiels: { arb1: { nom: 'Camille BERNARD', etab: 'Collège Jean-Moulin', niv: 'District' }, sec: { nom: 'Yanis MOREAU', etab: 'Collège Jean-Moulin', niv: 'Établissement' }, chr: { nom: 'Emma GIRARD', etab: 'Collège Pasteur', niv: 'Établissement' } },
    cfg: { periods: 2, dur: 20, ot: 5, tm: 3 }, events: ev, period: 2, clock: { rem: 0, run: false, at: 0 }, parties: [], obs: '', sig: {}, tab: { A: '', B: '' }, forfait: '', ...extra });
  const E = (p, t, team, n, k, pts = 0) => ({ id: uid(), p, t, team, n, k, pts });
  const rep = { add: 0, upd: 0, same: 0, bad: 0 };
  [mk('handball', 'Collège Jean-Moulin', 'Collège Pasteur', [E(1, '02:10', 'A', '7', 'but', 1), E(1, '05:44', 'B', '4', 'but', 1), E(1, '09:02', 'A', '10', 'but', 1), E(1, '12:30', 'B', '9', '2m'), E(2, '03:15', 'A', '7', 'b7', 1), E(2, '11:40', 'B', '4', 'but', 1), E(2, '18:05', 'A', '10', 'but', 1)]),
   mk('handball', 'Collège Pasteur', 'Collège Curie', [E(1, '04:00', 'A', '4', 'but', 1), E(2, '06:20', 'B', '7', 'but', 1)]),
   mk('handball', 'Collège Curie', 'Collège Jean-Moulin', [E(1, '03:00', 'B', '7', 'but', 1), E(2, '15:00', 'B', '10', 'but', 1), E(2, '16:30', 'A', '4', 'but', 1)])
  ].forEach(s => importObj(s, rep));
  report(rep);
}
document.addEventListener('input', e => {
  if (e.target.dataset && e.target.dataset.d) { const d = DB.draft, k = e.target.dataset.d, v = e.target.value; const ks = k.split('.');
    if (ks.length > 1) { let o = d; for (const x of ks.slice(0, -1)) o = o[x]; o[ks.at(-1)] = ks[0] === 'pl' && ks.at(-1) === 'nom' ? v.toUpperCase() : v; } else d[k] = v; if (k === 'sport') d.touched = true;
    if (k === 'A' || k === 'B') { d.pl = d.pl || { A: [], B: [] }; const tm = DB.ins.teams[v]; d.pl[k] = tm ? clonePl(tm.players) : []; d.pl['init' + k] = v; }
    const empty = !Object.values(d.off).some(Boolean); if ((k === 'A' || k === 'B') && d.A && d.B && empty) autoOff(d);
    save(); if (e.target.tagName === 'SELECT') render(); return; }
  if (e.target.id === 'fq') { F.q = e.target.value; const p = e.target.selectionStart; render(); const i = $('#fq'); i.focus(); i.setSelectionRange(p, p); }
  if (e.target.dataset.f) { F[e.target.dataset.f] = e.target.value; render(); }
  if (e.target.dataset.pts) { DB.pts[e.target.dataset.pts] = +e.target.value || 0; save(); const k = e.target.dataset.pts; render(); const i = document.querySelector(`[data-pts="${k}"]`); i && i.focus(); }
});
document.addEventListener('change', e => { if (e.target.id === 'files' || e.target.id === 'restorefile') importFiles(e.target.files); if (e.target.id === 'xfiles') importOpuss(e.target.files); if (e.target.id === 'qrPhoto' && e.target.files[0]) { const f = e.target.files[0]; e.target.value = ''; scanPhoto(f); } });
document.addEventListener('dragover', e => { const d = e.target.closest && e.target.closest('#drop'); if (d) { e.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave', e => { const d = e.target.closest && e.target.closest('#drop'); if (d) d.classList.remove('over'); });
document.addEventListener('drop', e => { const d = e.target.closest && e.target.closest('#drop'); if (d) { e.preventDefault(); importFiles(e.dataTransfer.files); } const x = e.target.closest && e.target.closest('#dropx'); if (x) { e.preventDefault(); x.classList.remove('over'); importOpuss(e.dataTransfer.files); } });
document.addEventListener('dragover', e => { const x = e.target.closest && e.target.closest('#dropx'); if (x) { e.preventDefault(); x.classList.add('over'); } });
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return; const a = el.dataset.act, d = el.dataset, s = DB.sheets[curId];
  if (a === 'ovbg') { if (e.target === el) { stopScan(); ov(''); } return; }
  switch (a) {
    case 'go': view = d.v; render(); scrollTo(0, 0); break;
    case 'open': curId = d.id; view = 'detail'; render(); scrollTo(0, 0); break;
    case 'close': ov(''); break;
    case 'confirm': { const f = pending; pending = null; ov(''); f && f(); } break;
    case 'paste': { const t = $('#codes').value; const parts = [...(t.match(/TMU1:[A-Za-z0-9+/=]+/g) || []), ...(t.match(/TMQ1\|[^\n\r]+/g) || [])]; if (!parts.length && (t.trim().startsWith('{') || t.trim().startsWith('['))) parts.push(t); const rep = { add: 0, upd: 0, same: 0, bad: 0 };
      if (!parts.length) return toast('Aucun code TMU1 reconnu.', true); for (const p of parts) { try { importObj(p.startsWith('TMQ1|') ? qrDecode(p) : fromCode(p), rep); } catch (x) { rep.bad++; } } report(rep); } break;
    case 'val': s.profNote = $('#note').value; s.status = 'valide'; s.validatedAt = Date.now(); save(); render(); toast('Feuille validée.'); break;
    case 'unval': s.status = 'clos'; save(); render(); break;
    case 'note': s.profNote = $('#note').value; save(); toast('Note enregistrée.'); break;
    case 'del': ask('Supprimer cette feuille ?', 'Supprimer', () => { delete DB.sheets[curId]; save(); view = 'list'; render(); }); break;
    case 'print': $('#print').innerHTML = sheetHTML(s); try { window.print(); } catch (x) { toast('Impression indisponible ici : utilise Télécharger (.html).', true); } break;
    case 'pdf': case 'xlsx': { el.disabled = true; try { const r = await exportSheet(s, a); if (r !== 'ok') toast('Téléchargement impossible ici.', true); } catch (x) { toast('Export impossible : ' + x.message, true); } el.disabled = false; } break;
    case 'dlhtml': { const r = await saveFile(fileName(s, 'html'), standaloneSheet(s)); if (r !== 'ok') toast('Téléchargement impossible ici.', true); } break;
    case 'csv': { const r = await saveFile(`TablMark_resultats_${new Date().toISOString().slice(0, 10)}.csv`, resultsCSV(filtered())); if (r !== 'ok') toast('Téléchargement impossible ici.', true); } break;
    case 'backup': { const r = await saveFile(`TablMark_sauvegarde_${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify({ app: 'TablMarkUNSS-prof', at: Date.now(), sheets: Object.values(DB.sheets) })); if (r !== 'ok') toast('Téléchargement impossible ici.', true); } break;
    case 'restore': ov(`<h3>Restaurer une sauvegarde</h3><p class="small muted">Les feuilles de la sauvegarde s’ajoutent à celles déjà présentes.</p><input type="file" id="restorefile" accept=".json"><div class="row" style="justify-content:flex-end;margin-top:10px"><button data-act="close">Fermer</button></div>`); break;
    case 'jocsv': { const rows = [['Jeune officiel', 'Établissement', 'Licence UNSS', 'N° JO', 'Niveau', 'Matchs', 'Fonctions', 'Activités']]; for (const tr of document.querySelectorAll('tbody tr')) rows.push([...tr.cells].map(c => c.textContent)); const r = await saveFile('TablMark_jeunes_officiels.csv', csv(rows)); if (r !== 'ok') toast('Téléchargement impossible ici.', true); } break;
    case 'demo': demo(); break;
    case 'autooff': autoOff(DB.draft); save(); render(); toast('Jeunes officiels répartis : vérifie les choix.'); break;
    case 'newdraft': DB.draft = newDraft(); save(); render(); break;
    case 'mkprep': makePrep(); break;
    case 'scan': openScan(); break;
    case 'qrphoto': $('#qrPhoto').click(); break;
    case 'closescan': stopScan(); ov(''); break;
    case 'addpl': plDialog('add', d.t); break;
    case 'reppl': plDialog('rep', d.t, d.i); break;
    case 'delpl': { const L = DB.draft.pl[d.t], o = L[+d.i]; ask(`Retirer ${o.nom} ${o.prenom} de la liste de ce match ?`, 'Retirer', () => { L.splice(+d.i, 1); save(); render(); }); } break;
    case 'pickpl': applyPl(d.m, d.t, d.i, CANDS[+d.c], false); break;
    case 'manpl': { const nom = $('#mnom').value.trim().toUpperCase(), prenom = cap($('#mpre').value.trim()), lic = $('#mlic').value.trim(); if (!nom) return $('#mnom').focus(); applyPl(d.m, d.t, d.i, { nom, prenom, lic }, true); } break;
    case 'insclear': ask('Vider la base d’inscrits importée d’OPUSS ?', 'Vider', () => { DB.ins = { teams: {}, jo: {}, files: [] }; DB.draft = null; save(); render(); }); break;
    case 'prepdl': { const p = DB.prep[+d.i]; const r = await saveFile('Prepa_' + fileName(p, 'json'), JSON.stringify(p)); if (r !== 'ok') toast('Téléchargement impossible ici : utilise « Code ».', true); } break;
    case 'prepqr': { if (typeof qrcode === 'undefined') return toast('QR code indisponible : utilise le fichier.', true);
      const pr = DB.prep[+d.i], Q = prepChunks(pr); let k = 0, run = true;
      ov(`<h3>QR code de la feuille préparée</h3><p class="small" style="margin:0 0 10px">${esc(teamLabel(pr, 'A'))} <span class="muted">contre</span> ${esc(teamLabel(pr, 'B'))} · ${esc(fmtDate(pr.meta.date))}</p>
      <div class="qrbox" id="qrc"></div>${Q.length > 1 ? `<div class="qrnav"><button data-act="qrk" data-v="-1" aria-label="QR précédent">‹</button><b id="qrn"></b><button data-act="qrk" data-v="1" aria-label="QR suivant">›</button><button data-act="qrpause" id="qrp">Pause</button></div>` : ''}
      <p class="small muted">Sur la tablette : <b>TablMarkUNSS Élève → Importer une feuille du prof → Scanner le QR code du prof</b>.${Q.length > 1 ? ` La feuille tient en <b>${Q.length} QR codes</b> qui défilent tout seuls : garde la tablette pointée jusqu’à « Feuille reçue ».` : ''}</p>
      <p class="small muted">Lecture difficile ? Monte la luminosité de l’écran au maximum et éloigne un peu les appareils.</p><div class="row" style="justify-content:flex-end"><button class="btn-p" data-act="close">Fermer</button></div>`);
      const show = () => { $('#qrc').innerHTML = qrSvg(Q[k]); const n = $('#qrn'); if (n) n.textContent = `${k + 1} / ${Q.length}`; };
      window.__qrShow = dv => { k = (k + dv + Q.length) % Q.length; show(); };
      window.__qrToggle = () => { run = !run; $('#qrp').textContent = run ? 'Pause' : 'Reprendre'; clearInterval(window.__qrc); if (run) window.__qrc = setInterval(() => window.__qrShow(1), 1800); };
      show(); if (Q.length > 1) window.__qrc = setInterval(() => window.__qrShow(1), 1800); } break;

    case 'prepdel': ask('Supprimer cette feuille préparée ?', 'Supprimer', () => { DB.prep.splice(+d.i, 1); save(); render(); }); break;
    case 'wipe': ask('Effacer toutes les feuilles de ce navigateur ? Pense à faire une sauvegarde avant.', 'Tout effacer', () => { DB.sheets = {}; save(); render(); }); break;
  }
